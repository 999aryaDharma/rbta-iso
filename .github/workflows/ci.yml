name: CI

on:
  push:
    branches: [prod/final-dashboard-demo]
  pull_request:
    branches: [prod/final-dashboard-demo]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run

  # CD pull-based di CT hanya men-deploy commit ujung branch yang bertag release-*.
  # Job ini memberi tag itu setelah backend + frontend hijau pada push (bukan PR).
  release:
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="release-$(date -u +%Y.%m.%d-%H%M)-${GITHUB_SHA::7}"
          git tag -a "$TAG" -m "rilis otomatis: CI hijau pada $GITHUB_SHA"
          git push origin "$TAG"
