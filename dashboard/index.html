<!DOCTYPE html>
<html lang="en" class="bg-kumo-canvas text-kumo-default" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>RBTA + Isolation Forest Security Analytics</title>
    <script>
      // Terapkan tema Kumo dari localStorage sebelum paint pertama agar layar tidak berkedip.
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = ['light', 'dark', 'system'].indexOf(stored) !== -1 ? stored : 'system';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-mode', isDark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
